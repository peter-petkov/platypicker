<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap skin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../src/platypicker.css">
    <style>
        body {
            padding: 1.5rem;
            background: transparent;
        }

        select[multiple] {
            min-width: 18rem;
        }

        /* The docs page shows this in a short frame, where the usual 45vh would leave the list cramped. */
        platy-picker {
            --platypicker-max-height: 16rem;
        }
    </style>
    <script>
        // Follows the docs page's theme switch when it's shown there, as Bootstrap's own data-bs-theme.
        try {
            const root = parent.document.documentElement;
            const dark = matchMedia("(prefers-color-scheme: dark)");
            const sync = () => document.documentElement.dataset.bsTheme = root.dataset.theme ?? (dark.matches ? "dark" : "light");
            new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
            dark.addEventListener("change", sync);
            sync();
        } catch {
        }
    </script>
</head>
<body>
<form class="row g-3" novalidate>
    <div class="col-sm-6">
        <label class="form-label" for="city">City</label>
        <platy-picker search search-placeholder="Search cities…">
            <select id="city" name="city">
                <option data-subtext="Japan">Tokyo</option>
                <option data-subtext="France" selected>Paris</option>
                <option data-subtext="United States">New York</option>
                <option data-subtext="South Africa">Cape Town</option>
                <option data-subtext="Australia">Sydney</option>
                <option data-subtext="Brazil">Rio de Janeiro</option>
                <option data-subtext="Egypt">Cairo</option>
                <option data-subtext="India">Mumbai</option>
            </select>
        </platy-picker>
    </div>
    <div class="col-sm-6">
        <label class="form-label" for="plants">Plants</label>
        <platy-picker search controls placeholder="Pick some plants">
            <select id="plants" name="plants" multiple size="1" required>
                <option selected>🌵 Cactus</option>
                <option selected>🌹 Rose</option>
                <option>🌻 Sunflower</option>
                <option>🌷 Tulip</option>
                <optgroup label="Herbs">
                    <option>🌿 Basil</option>
                    <option disabled>🍃 Mint</option>
                </optgroup>
                <option>🎋 Bamboo</option>
            </select>
        </platy-picker>
    </div>
    <div class="col-sm-6">
        <label class="form-label" for="small">Small, invalid</label>
        <platy-picker>
            <select id="small" name="small" class="form-select-sm is-invalid">
                <option>Sofa</option>
                <option>Armchair</option>
                <option>Bed</option>
            </select>
        </platy-picker>
    </div>
    <div class="col-sm-6">
        <label class="form-label" for="disabled">Disabled</label>
        <platy-picker>
            <select id="disabled" name="disabled" disabled>
                <option>Kitchen</option>
            </select>
        </platy-picker>
    </div>
</form>
<script type="module">
    import "../src/skins/bootstrap.js";
    import "../src/platypicker.js";
</script>
</body>
</html>
