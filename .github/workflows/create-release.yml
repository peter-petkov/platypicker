name: Create Release From Version Tag

on:
  push:
    tags:
      - '*'
      - '*.*'
      - '*.*.*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release. Expected format: X, X.Y, or X.Y.Z'
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.set_tag.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: set_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Invalid version format: ${TAG}"
            echo "Expected format: X, X.Y, or X.Y.Z where each part contains only digits."
            exit 1
          fi

          echo "Validated version: ${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create Git tag if run manually
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.set_tag.outputs.tag }}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists locally."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub label for version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "${{ steps.set_tag.outputs.tag }}" \
            --color 0366d6 \
            --description "Release version ${{ steps.set_tag.outputs.tag }}" \
            || echo "Label already exists"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.set_tag.outputs.tag }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes \
              --draft=false \
              --prerelease=false
          fi