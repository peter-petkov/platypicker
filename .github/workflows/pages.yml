name: Publish the docs page to GitHub Pages

# Runs with each release, like publish.yml, so the docs match the version on npm.
on:
  push:
    tags:
      - '*'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # src/ imports Burrowkit, which the page finds in node_modules through its import map.
      - name: Install dependencies
        run: npm ci

      # The page lives in docs/ and refers to the repository root as ../. On the site, docs/ becomes the root and
      # the files it uses sit beside it. The version comes from the latest tag, as publish.yml sets it.
      - name: Assemble the site
        run: |
          VERSION="$(git describe --tags --abbrev=0)"

          mkdir _site
          cp -r docs/. _site/
          cp -r src _site/src
          mkdir -p _site/node_modules/burrowkit
          cp -r node_modules/burrowkit/src _site/node_modules/burrowkit/src
          cp -r node_modules/burrowkit/docs _site/node_modules/burrowkit/docs
          cp platylogo.png platylogo.ico _site/
          printf '{ "version": "%s" }\n' "${VERSION}" > _site/package.json
          sed -i 's#\.\./#./#g' _site/*.html _site/*.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4