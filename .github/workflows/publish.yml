name: Release and publish platypicker to npm

on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release and publish. Expected format: X, X.Y, or X.Y.Z"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  release-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Invalid version format: ${VERSION}"
            echo "Expected format: X, X.Y, or X.Y.Z where each part contains only digits."
            exit 1
          fi

          echo "Using version: ${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create Git tag if run manually
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists locally."
          else
            git tag "${VERSION}"
            git push origin "${VERSION}"
          fi

      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.version.outputs.version }}
          fetch-depth: 0

      - name: Create GitHub label for version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "${{ steps.version.outputs.version }}" \
            --color 0366d6 \
            --description "Release version ${{ steps.version.outputs.version }}" \
            || echo "Label already exists"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # The notes are the version's section of CHANGELOG.md, from its "## <version>" heading to the next one, with
          # the README's relative links made absolute. A version without a section, like a bugfix release, gets
          # GitHub's generated notes instead.
          awk -v heading="## ${VERSION}" '
            { sub(/\r$/, "") }
            /^## / { if (found) exit; if ($0 == heading) { found = 1; next } }
            found
          ' CHANGELOG.md \
            | sed "s#](README.md#](https://github.com/${{ github.repository }}/blob/${VERSION}/README.md#g" \
            > release-notes.md

          if [[ -s release-notes.md ]] && grep -q '[^[:space:]]' release-notes.md; then
            NOTES=(--notes-file release-notes.md)
          else
            NOTES=(--generate-notes)
          fi

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists."
          else
            gh release create "${VERSION}" \
              --title "${VERSION}" \
              "${NOTES[@]}" \
              --draft=false \
              --prerelease=false
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # The stylesheet carries a copy of Burrowkit's shared CSS, which has to be the installed release's.
      - name: Check the synced CSS
        run: npm run check:css

      - name: Build package if necessary
        run: npm run build --if-present

      - name: Run package tests
        run: npm test --if-present

      # npm needs all three parts, so a tag like 2.0 is published as 2.0.0. package.json is bumped with each release
      # too, so it may say the version already, which npm version only accepts with --allow-same-version.
      - name: Set package version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          while [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; do VERSION="${VERSION}.0"; done
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --provenance --access public